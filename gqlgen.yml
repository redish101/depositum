# Where are all the schema files located?
schema:
  - pkg/graph/schema/*.graphqls

# Generated execution code
exec:
  package: graph
  layout: single-file
  filename: pkg/graph/generated.go

# Generated models
model:
  filename: pkg/graph/model/models_gen.go
  package: model

# Resolver implementations
resolver:
  package: resolver
  layout: follow-schema
  dir: pkg/graph/resolver
  filename_template: "{name}.go"

call_argument_directives_with_null: true

autobind:
  - github.com/redish101/depositum/pkg/api/v1

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.Uint

  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int32

  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
